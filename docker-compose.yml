version: '3.8'

services:
  # 1. MySQL 8 Database Service
  db:
    image: mysql:8.0
    container_name: warehouse_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: warehouse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-initialize database schema on first container startup
      - ./database/schema_mysql.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. phpMyAdmin GUI for Database Management (Optional for IT DBA)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: warehouse_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  # 3. Node.js Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse_backend_api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/usr/src/app/uploads
    environment:
      - PORT=5000
      - DATABASE_URL=mysql://root:rootpassword@db:3306/warehouse_db
      - JWT_SECRET=super_secret_warehouse_jwt_key_production
      - USE_MOCK_DB=false
    depends_on:
      db:
        condition: service_healthy

  # 4. Next.js Frontend Web UI Service (Served via Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: warehouse_frontend_ui
    restart: always
    ports:
      - "3100:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
